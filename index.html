<script>

// with the existing selection, SVG export, fill, and JSON infrastructure.

function addStraightPoint(p){

   $('hint').textContent='Tap/click to add corners; Enter or Finish line completes. Tap the last point again to finish.';

// untouched quadratics and replace only the interval between the anchors.
function replaceStrokeArc(st,a,b,replacement){

   break;

function reverseQuadratics(arr){return arr.slice().reverse().map(s=>({p0:cp(s.p1),p1:cp(s.p0),c:cp(s.c),cornerStart:!!s.cornerStart}))}

const mix=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t});

function skinColor(){
  const t=skinState.complexion/100;
  const anchors=[{x:58,y:37,z:31},{x:109,y:74,z:58},{x:159,y:117,z:90},{x:205,y:164,z:131},{x:241,y:211,z:185}];

  c.y+=6*u-7*Math.min(0,u);

function hairColor(){

    brown:[{x:35,y:22,z:16},{x:76,y:49,z:31},{x:122,y:83,z:52},{x:176,y:132,z:89}],
    blonde:[{x:117,y:88,z:34},{x:170,y:132,z:55},{x:213,y:178,z:96},{x:245,y:224,z:166}],
    auburn:[{x:59,y:27,z:19},{x:108,y:51,z:33},{x:160,y:84,z:54},{x:211,y:136,z:92}],
    red:[{x:73,y:24,z:17},{x:134,y:52,z:28},{x:188,y:90,z:44},{x:228,y:144,z:84}],
    gray:[{x:58,y:57,z:60},{x:103,y:102,z:106},{x:156,y:156,z:160},{x:219,y:220,z:224}]
  };

// Use geometry, not the viewport. Quadratic extrema give the exact
// vector bounds; the visible reference image is included at any opacity.
function artworkBounds(){
 let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;

   x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)};

  addPoint(seg.p0);addPoint(seg.p1);

   const a=seg.p0[axis],b=seg.c[axis],c=seg.p1[axis],denom=a-2*b+c;

function exportSceneSvg(bounds=null){

async function exportRaster(kind='png'){

   const bounds=artworkBounds();

   const svgText=exportSceneSvg(bounds);
   const url=URL.createObjectURL(new Blob([svgText],{type:'image/svg+xml;charset=utf-8'}));
   const img=new Image();

   ctx.drawImage(img,0,0,w,h);

// Round only the exported data; do not alter in-memory editing precision.
function compactStrokes(){
  const round=n=>Math.round(n*1000)/1000;
  return strokes.map(st=>({...st,segs:st.segs.map(seg=>({
    p0:{x:round(seg.p0.x),y:round(seg.p0.y)},
    c:{x:round(seg.c.x),y:round(seg.c.y)},
    p1:{x:round(seg.p1.x),y:round(seg.p1.y)},
    ...(seg.cornerStart?{cornerStart:true}:{})
  }))}));
}
let sketchFileHandle=null;
