 const g=gesture,b=g.bounds,w=Math.max(20/view.s,b.x1-b.x0),h=Math.max(20/view.s,b.y1-b.y0);
 const dx=p.x-g.origin.x,dy=p.y-g.origin.y;
 const fx=Math.max(.08,1+dx/w),fy=Math.max(.08,1+dy/h);
 scaleSelection(g.base,{x:b.x0,y:b.y0},fx,fy);render();}

else if(gesture.kind==='slope'){rotateSlope(strokeById(gesture.id),gesture,p);render()}
else if(gesture.kind==='deform'){deformStroke(strokeById(gesture.id),gesture.base,gesture.grabS,sub(p,gesture.origin),gesture.radius);render()}}
function end(e){if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.delete(e.pointerId);if(gesture?.kind==='pinch'){if(pointers.size<2)gesture=null;return}if(gesture?.kind==='draw'&&draft?.raw.length>1){let release=worldPoint(e),snapEnd=nearestStrokeEndpoint(release);if(snapEnd){draft.raw[draft.raw.length-1]=cp(snapEnd);release=snapEnd;}updateDraft(release,true);let fitted=draftSegments();if(snapEnd&&fitted.length){fitted[fitted.length-1].p1=cp(snapEnd)}if(fitted.length){checkpoint();let st={id:nextId++,segs:fitted};strokes.push(st);selected=null;selectedIds.clear()}}if(gesture?.kind==='box'&&selectionRect){selectBox(selectionRect.a,selectionRect.b,gesture.additive)}selectionRect=null;draft=null;gesture=null;invalidateFills();render()}
svg.addEventListener('pointerdown',start);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
svg.addEventListener('wheel',e=>{e.preventDefault();setZoom(view.s*Math.exp(-e.deltaY*.0015),screenPoint(e))},{passive:false});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('tolerance').oninput=e=>$('tolOut').textContent=e.target.value;
$('corner').oninput=e=>$('cornerOut').textContent=e.target.value;
$('snapDist').oninput=e=>$('snapOut').textContent=e.target.value;
$('influence').oninput=e=>$('influenceOut').textContent=e.target.value;
$('tangents').onchange=render;$('projection').onchange=render;
$('importImage').onclick=()=>$('imageFile').click();
$('imageFile').onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 if(!/^image\/(png|jpeg)$/.test(file.type)){alert('Choose a JPG or PNG image');return}
 try{
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=data});
  checkpoint();
  const w=img.naturalWidth,h=img.naturalHeight;
  const scale=Math.min(1,Math.min(svg.clientWidth/w,svg.clientHeight/h)*.85)/view.s;
  reference={data,width:w,height:h,scale,x:(svg.clientWidth/2-view.x)/view.s-w*scale/2,y:(svg.clientHeight/2-view.y)/view.s-h*scale/2,visible:true};
  syncReferenceControls();render();
 }catch(err){alert('Could not load image: '+err.message)}e.target.value='';
};
$('imageVisible').onchange=e=>{if(reference){reference.visible=e.target.checked;render()}};
$('imageScale').oninput=e=>{if(!reference)return;let target=Number(e.target.value)/100,old=reference.scale;reference.x+=(reference.width*(old-target))/2;reference.y+=(reference.height*(old-target))/2;reference.scale=target;$('imageScaleOut').textContent=e.target.value;render()};
$('clearImage').onclick=()=>{if(reference){checkpoint();reference=null;syncReferenceControls();render()}};
$('gapSize').oninput=()=>{$('gapOut').textContent=$('gapSize').value;invalidateFills();render()};
$('clearFills').onclick=()=>{if(!regions.length)return;checkpoint();regions=[];selectedRegion=-1;invalidateFills();render()};
$('fillColor').addEventListener('change',()=>{regionColorCheckpointed=false});
$('fillColor').addEventListener('input',e=>{if(selectedRegion<0||!regions[selectedRegion])return;if(!regionColorCheckpointed){checkpoint();regionColorCheckpointed=true}regions[selectedRegion].color=e.target.value;if(!recolorCachedRegion(selectedRegion,e.target.value))fillsDirty=true;render()});
$('undo').onclick=undo;$('redo').onclick=redo;$('del').onclick=()=>{if(!selectedIds.size)return;checkpoint();strokes=strokes.filter(s=>!selectedIds.has(s.id));selected=null;selectedIds.clear();invalidateFills();render()};
$('group').onclick=()=>{if(selectedIds.size<2)return;checkpoint();let g=nextGroup++;for(let id of selectedIds)strokeById(id).group=g;render()};
$('ungroup').onclick=()=>{if(!selectedIds.size)return;checkpoint();for(let id of selectedIds){let st=strokeById(id);if(st)delete st.group}render()};
$('zoomIn').onclick=()=>setZoom(view.s*1.35,center());$('zoomOut').onclick=()=>setZoom(view.s/1.35,center());$('resetView').onclick=()=>{view={x:0,y:0,s:1};render()};
let savedDrawingName='spline-sketch';
try{savedDrawingName=localStorage.getItem('splineSketchDrawingName')||savedDrawingName}catch(e){}
$('drawingName').value=savedDrawingName;
function nameForSave(){
 let raw=$('drawingName').value.trim().replace(/\.(svg|json)$/i,'').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim();
 if(!raw)raw='spline-sketch';
 savedDrawingName=raw;$('drawingName').value=raw;
 try{localStorage.setItem('splineSketchDrawingName',raw)}catch(e){}
 return raw;
}
$('drawingName').addEventListener('change',nameForSave);
function toggleOptions(open){$('optionsPanel').classList.toggle('open',open);$('optionsToggle').setAttribute('aria-expanded',String(open));}
$('optionsToggle').onclick=()=>toggleOptions(!$('optionsPanel').classList.contains('open'));
$('closeOptions').onclick=()=>toggleOptions(false);
function download(data,name,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>{if(fillsDirty)buildRegions();let fills=fillImages.map(f=>`<image x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" href="${f.data}"/>`).join('\n');let paths=strokes.map(st=>`<path d="${dpath(st.segs)}" fill="none" stroke="#17212e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('\n');download(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-view.x/view.s} ${-view.y/view.s} ${svg.clientWidth/view.s} ${svg.clientHeight/view.s}">${fills}${paths}</svg>`,nameForSave()+'.svg','image/svg+xml')};
// Round only the exported data; do not alter in-memory editing precision.
function compactStrokes(){
  const round=n=>Math.round(n*1000)/1000;
  return strokes.map(st=>({...st,segs:st.segs.map(seg=>({
    p0:{x:round(seg.p0.x),y:round(seg.p0.y)},
    c:{x:round(seg.c.x),y:round(seg.c.y)},
    p1:{x:round(seg.p1.x),y:round(seg.p1.y)},
    ...(seg.cornerStart?{cornerStart:true}:{})
  }))}));
}
$('save').onclick=()=>download(JSON.stringify({format:'spline-sketch-v4',strokes:compactStrokes(),reference,regions,drawingName:nameForSave()},null,2),nameForSave()+'.json','application/json');$('load').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.strokes)||!obj.strokes.every(st=>Array.isArray(st.segs)))throw Error('Not a sketch file');checkpoint();$('drawingName').value=(obj.drawingName||f.name.replace(/\.json$/i,''));nameForSave();strokes=obj.strokes;reference=obj.reference||null;regions=obj.regions||[];selectedRegion=-1;regionColorCheckpointed=false;invalidateFills();syncReferenceControls();nextId=1+Math.max(0,...strokes.map(s=>s.id));selected=null;selectedIds.clear();nextGroup=1+Math.max(0,...strokes.map(st=>st.group||0));render()}catch(err){alert('Could not open drawing: '+err.message)}e.target.value=''};
$('undoSegment').addEventListener('pointerdown',e=>e.stopPropagation());$('undoSegment').onclick=backSegment;
window.addEventListener('keydown',e=>{if(e.key==='Escape' && draft && gesture?.kind==='draw'){e.preventDefault();backSegment();return}let mod=e.metaKey||e.ctrlKey;if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key==='Delete'||e.key==='Backspace'){$('del').click()}});
syncReferenceControls();setMode('draw');})();
</script></body></html>
