function snapshot(){return JSON.stringify({strokes,selected,nextId,nextGroup,selectedIds:[...selectedIds]})}

function restore(str){let x=JSON.parse(str);strokes=x.strokes;selected=x.selected;selectedIds=new Set(x.selectedIds|| (selected===null?[]:[selected]));nextId=x.nextId;nextGroup=x.nextGroup||1;draft=null;render()}

function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());buttons()}
function buttons(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length;$('del').disabled=!selectedIds.size;$('group').disabled=selectedIds.size<2;$('ungroup').disabled=![...selectedIds].some(id=>strokeById(id)?.group!=null)}
// Quadratic least-squares fit to EVERY sample in the active tail. The two
// endpoints are fixed. After the first segment, the start tangent is fixed.
// Frozen segments are never modified.
function fitTail(points, incoming=null) {
  if(points.length<2)return null;
  const p0=points[0], p1=points[points.length-1];
  const lengths=[0];let total=0;
  for(let i=1;i<points.length;i++){total+=dist(points[i-1],points[i]);lengths.push(total)}
  if(total<0.05)return null;
  let ts=lengths.map(x=>x/total), seg, maxErr=0, rms=0;
  // Initial chord-length parameters. Refine with closest-curve projections:
  // this reduces sensitivity to stylus speed and unequal sample spacing.
  for(let iteration=0;iteration<3;iteration++){
    let c;
    if(incoming){
      let num=0,den=0;
      for(let i=1;i<points.length-1;i++){
        let t=ts[i],u=1-t,a=2*u*t;
        const base=add(mul(p0,u*u+a),mul(p1,t*t));
        num+=a*dot(incoming,sub(points[i],base));den+=a*a;

      // c = p0 + alpha * incoming, keeps the existing tangent direction.
      let alpha=den>1e-12?num/den:total/2;
      alpha=Math.max(0.01,Math.min(alpha,Math.max(total,dist(p0,p1))*1.5));
      c=add(p0,mul(incoming,alpha));
    }else{
      let sum={x:0,y:0},den=0;
      for(let i=1;i<points.length-1;i++){
        const t=ts[i],u=1-t,a=2*u*t;
        const base=add(mul(p0,u*u),mul(p1,t*t));
        sum=add(sum,mul(sub(points[i],base),a));den+=a*a;
      }
      c=den>1e-12?mul(sum,1/den):mul(add(p0,p1),0.5);
    }
    seg={p0:cp(p0),c,p1:cp(p1)};
    if(iteration===2)break;
    // Find closest points near the previous parameter, preserving order.
    // A monotonic search prevents jumping to a different side of a loop.
    const next=ts.slice();
    for(let i=1;i<points.length-1;i++){
      const low=Math.max(ts[i-1]+1e-6,ts[i]-.12);
      const high=Math.min(ts[i+1]-1e-6,ts[i]+.12);

        if(d<bestD){bestD=d;best=t}

      next[i]=best;
    }
    ts=next;

// Signed geometric curvature at a quadratic segment endpoint (1/pixel).
// Penalizing a curvature jump reduces the flattened/pointed transitions that
// remain possible even when neighboring tangent directions match exactly.
function endCurvature(s){
  const v=sub(s.p1,s.c), a=add(sub(s.p1,mul(s.c,2)),s.p0);
  const n=len(v);
  return n<1e-4?null:(v.x*a.y-v.y*a.x)/(2*n*n*n);

function startCurvature(s){
  const v=sub(s.c,s.p0), a=add(sub(s.p1,mul(s.c,2)),s.p0);
  const n=len(v);
  return n<1e-4?null:(v.x*a.y-v.y*a.x)/(2*n*n*n);

function curvatureCost(first,next,tol,scale){
  const a=endCurvature(first), b=startCurvature(next);
  if(a===null || b===null)return tol*3;
  // Curvature times a characteristic 35-pixel length gives turning angle.
  // Make curvature consistency important without overriding fit accuracy.
  const turnDifference=Math.min(2,Math.abs(a-b)*Math.min(50,Math.max(22,scale*.3)));

function newDraft(p){return {raw:[cp(p)],segs:[],joins:[],start:0,active:null}}
// Undo one committed segment while the pointer is still drawing.
// Discard its samples and the unfinished tail; the next pointer samples resume
// from the previous junction, without modifying any older segment.
function backSegment(){
  if(!draft || gesture?.kind!=='draw')return;
  if(draft.segs.length){
    draft.segs.pop();
    draft.start=draft.joins.pop()??0;
    draft.raw.length=draft.start+1;
    draft.active=null;
  }else if(draft.raw.length>1){
    draft.raw.length=1;
    draft.active=null;

  // The earliest possible split must still have enough points to be stable.
  for(let pass=0;pass<80;pass++){
    const prev=draft.segs.at(-1);
    const dir=prev?norm(sub(prev.p1,prev.c)):null;

    // Prefer the longest valid earlier segment, subject to fitting tolerance.

      // Prefer a junction whose outgoing tangent won't immediately double back.

// Frozen spline segments are drawn as soon as they are committed.
// The only temporary raw ink is the tail that has not yet been frozen.
if(draft){
 if(draft.segs.length) {
   node('path',{d:dpath(draft.segs),fill:'none',stroke:'#17212e',
     'stroke-width':2.5/view.s,'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'none'},art);
   tangentMarkers(draft.segs);

   const path='M '+raw[0].x+' '+raw[0].y+' '+raw.slice(1).map(p=>'L '+p.x+' '+p.y).join(' ');

// Find the nearest point along a stroke, including its normalized path distance.
function closestOnStroke(st,p){

// Drag a point on the stroke. Deform smoothly in arc-length space;
// identical weights at shared junctions keep the spline connected.
// Each gesture uses an immutable baseline to prevent accumulated drift.
function deformStroke(st,base,grabS,delta,radius){
 // A strong, narrow Gaussian displacement can fold a curve over itself.
 // Increase the affected arc length as the requested movement grows.
 // For a Gaussian, max |w'(s)| = exp(-1/2)/sigma. Keeping
 // |delta| * max|w'| well below 1 avoids reversing the local stroke.

   const fromStart=wa + .5*span*slope(a);

   // long overshooting spikes near tight corners.

function bbox(st){let xs=[],ys=[];for(let seg of st.segs){for(let i=0;i<=24;i++){const p=qpoint(seg,i/24);xs.push(p.x);ys.push(p.y)}}return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)}}
function selectBox(a,b,additive){let x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);if(!additive)selectedIds.clear();for(let st of strokes){let bb=bbox(st);if(bb.x0>=x0&&bb.x1<=x1&&bb.y0>=y0&&bb.y1<=y1)groupMembers(st.id).forEach(id=>selectedIds.add(id))}selected=selectedIds.size?[...selectedIds][0]:null}
function selectionBounds(ids){let all=ids.map(id=>strokeById(id)).filter(Boolean).map(bbox);return {x0:Math.min(...all.map(b=>b.x0)),x1:Math.max(...all.map(b=>b.x1)),y0:Math.min(...all.map(b=>b.y0)),y1:Math.max(...all.map(b=>b.y1))}}
function scaleSelection(bases,anchor,fx,fy){for(let [id,segs] of bases){let st=strokeById(id);if(!st)continue;st.segs=segs.map(seg=>Object.fromEntries(['p0','c','p1'].map(k=>[k,{x:anchor.x+(seg[k].x-anchor.x)*fx,y:anchor.y+(seg[k].y-anchor.y)*fy}])))} }
function moveStroke(st,delta){for(let s of st.segs){s.p0=add(s.p0,delta);s.c=add(s.c,delta);s.p1=add(s.p1,delta)}}
function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('hint').textContent=({draw:'Draw with finger or Pencil. Completed curves freeze immediately; only the unfinished tail follows your pointer. Green = projected next 150 px. Two fingers zoom/pan.',move:'Drag empty space for a selection box. Shift-click or toggle Add selection to add strokes. Group makes them move together.',edit:'Drag a blue stroke to reshape. A selected group stretches or squashes together. Red markers identify joins.',pan:'One finger pans. Pinch with two fingers to zoom.'})[mode];render()}
function start(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();svg.setPointerCapture(e.pointerId);let scr=screenPoint(e),p=worldPoint(e);pointers.set(e.pointerId,scr);
if(pointers.size===2){if(gesture?.kind==='draw') {draft=null;render()}let a=[...pointers.values()];gesture={kind:'pinch',startView:{...view},center:mul(add(a[0],a[1]),.5),distance:dist(a[0],a[1])};return}
if(pointers.size>2)return;
if(mode==='pan'){gesture={kind:'pan',last:scr};return}
if(mode==='draw'){draft=newDraft(p);gesture={kind:'draw'};return}
let id=hitStroke(p),additive=e.shiftKey||$('addSelect').checked;
if(mode==='move'){
 if(id!==null){
   if(additive){selectHit(id,true);gesture={kind:'select'};render();return}
   if(!selectedIds.has(id))selectHit(id,false);
   checkpoint();gesture={kind:'move',last:p,ids:[...selectedIds]};render();return;
 }
 selectionRect={a:p,b:p};gesture={kind:'box',additive};render();return;
}
if(mode==='edit'&&id!==null){
  if(!selectedIds.has(id))selectHit(id,false);
  let ids=[...selectedIds];
  checkpoint();
  if(ids.length>1 || (strokeById(id)?.group!=null)){
    let bounds=selectionBounds(ids),base=new Map(ids.map(k=>[k,structuredClone(strokeById(k).segs)]));
    gesture={kind:'scale',origin:p,bounds,ids,base};
  }else{
    const st=strokeById(id),hit=closestOnStroke(st,p);
    const radius=Math.max(35/view.s,Math.min(hit.total*.24,155/view.s));
    gesture={kind:'deform',id,origin:p,grabS:hit.s,base:{segs:structuredClone(st.segs),lengths:hit.lengths},radius};
  }
  render();return;
}
if(!additive){selectedIds.clear();selected=null}gesture=null;render();}
function move(e){if(!pointers.has(e.pointerId))return;e.preventDefault();let s=screenPoint(e),p=worldPoint(e);pointers.set(e.pointerId,s);if(gesture?.kind==='pinch'&&pointers.size>=2){let a=[...pointers.values()],mid=mul(add(a[0],a[1]),.5),distance=dist(a[0],a[1]);let old=gesture.startView,zoom=Math.max(.15,Math.min(12,old.s*distance/(gesture.distance||1))),w={x:(gesture.center.x-old.x)/old.s,y:(gesture.center.y-old.y)/old.s};view={s:zoom,x:mid.x-zoom*w.x,y:mid.y-zoom*w.y};render();return}
if(pointers.size!==1||!gesture)return;
if(gesture.kind==='pan'){view.x+=s.x-gesture.last.x;view.y+=s.y-gesture.last.y;gesture.last=s;render()}
else if(gesture.kind==='draw'){updateDraft(p);render()}
else if(gesture.kind==='box'){selectionRect.b=p;render()}
else if(gesture.kind==='move'){for(let id of gesture.ids){const st=strokeById(id);if(st)moveStroke(st,sub(p,gesture.last))}gesture.last=p;render()}
else if(gesture.kind==='scale'){
 const g=gesture,b=g.bounds,w=Math.max(20/view.s,b.x1-b.x0),h=Math.max(20/view.s,b.y1-b.y0);
 const dx=p.x-g.origin.x,dy=p.y-g.origin.y;
 const fx=Math.max(.08,1+dx/w),fy=Math.max(.08,1+dy/h);
 scaleSelection(g.base,{x:b.x0,y:b.y0},fx,fy);render();}

else if(gesture.kind==='deform'){deformStroke(strokeById(gesture.id),gesture.base,gesture.grabS,sub(p,gesture.origin),gesture.radius);render()}}
function end(e){if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.delete(e.pointerId);if(gesture?.kind==='pinch'){if(pointers.size<2)gesture=null;return}if(gesture?.kind==='draw'&&draft?.raw.length>1){updateDraft(worldPoint(e),true);let fitted=draftSegments();if(fitted.length){checkpoint();let st={id:nextId++,segs:fitted};strokes.push(st);selected=null;selectedIds.clear()}}if(gesture?.kind==='box'&&selectionRect){selectBox(selectionRect.a,selectionRect.b,gesture.additive)}selectionRect=null;draft=null;gesture=null;render()}
svg.addEventListener('pointerdown',start);svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
svg.addEventListener('wheel',e=>{e.preventDefault();setZoom(view.s*Math.exp(-e.deltaY*.0015),screenPoint(e))},{passive:false});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('tolerance').oninput=e=>$('tolOut').textContent=e.target.value;
$('tangents').onchange=render;$('projection').onchange=render;$('undo').onclick=undo;$('redo').onclick=redo;$('del').onclick=()=>{if(!selectedIds.size)return;checkpoint();strokes=strokes.filter(s=>!selectedIds.has(s.id));selected=null;selectedIds.clear();render()};
$('group').onclick=()=>{if(selectedIds.size<2)return;checkpoint();let g=nextGroup++;for(let id of selectedIds)strokeById(id).group=g;render()};
$('ungroup').onclick=()=>{if(!selectedIds.size)return;checkpoint();for(let id of selectedIds){let st=strokeById(id);if(st)delete st.group}render()};
$('zoomIn').onclick=()=>setZoom(view.s*1.35,center());$('zoomOut').onclick=()=>setZoom(view.s/1.35,center());$('resetView').onclick=()=>{view={x:0,y:0,s:1};render()};
function download(data,name,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>{let paths=strokes.map(st=>`<path d="${dpath(st.segs)}" fill="none" stroke="#17212e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('\n');download(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-view.x/view.s} ${-view.y/view.s} ${svg.clientWidth/view.s} ${svg.clientHeight/view.s}">${paths}</svg>`,'spline-sketch.svg','image/svg+xml')};
// Round only the exported data; do not alter in-memory editing precision.
function compactStrokes(){
  const round=n=>Math.round(n*1000)/1000;
  return strokes.map(st=>({...st,segs:st.segs.map(seg=>({
    p0:{x:round(seg.p0.x),y:round(seg.p0.y)},
    c:{x:round(seg.c.x),y:round(seg.c.y)},
    p1:{x:round(seg.p1.x),y:round(seg.p1.y)}
  }))}));
}
$('save').onclick=()=>download(JSON.stringify({format:'spline-sketch-v2',strokes:compactStrokes()},null,2),'spline-sketch.json','application/json');$('load').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.strokes)||!obj.strokes.every(st=>Array.isArray(st.segs)))throw Error('Not a sketch file');checkpoint();strokes=obj.strokes;nextId=1+Math.max(0,...strokes.map(s=>s.id));selected=null;selectedIds.clear();nextGroup=1+Math.max(0,...strokes.map(st=>st.group||0));render()}catch(err){alert('Could not open drawing: '+err.message)}e.target.value=''};
$('undoSegment').addEventListener('pointerdown',e=>e.stopPropagation());$('undoSegment').onclick=backSegment;
window.addEventListener('keydown',e=>{if(e.key==='Escape' && draft && gesture?.kind==='draw'){e.preventDefault();backSegment();return}let mod=e.metaKey||e.ctrlKey;if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key==='Delete'||e.key==='Backspace'){$('del').click()}});
setMode('draw');})();
</script></body></html>
